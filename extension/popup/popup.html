<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDL Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon><path d="M19 17v4"></path><path d="M22 19l-3 3-3-3"></path></svg>
        </div>
        <span class="brand-name">StreamDL</span>
      </div>
      <div class="server-status" id="server-status">
        <span class="status-dot"></span>
        <span class="status-text" id="server-status-text">Checking...</span>
      </div>
    </header>

    <!-- Page Info Summary -->
    <div class="page-card">
      <div class="page-title" id="page-title" title="Active Tab">Detecting page...</div>
      <div class="page-url" id="page-url">...</div>
    </div>

    <!-- Main Content -->
    <main class="main-body">
      <!-- Detected Stream Box -->
      <div class="section-card" id="stream-section">
        <div class="section-header">
          <span class="section-title">Detected Stream</span>
          <span class="badge badge-type" id="stream-type-badge">Scanning...</span>
        </div>

        <div class="stream-preview" id="stream-preview">
          <div class="stream-preview-top">
            <div style="display: flex; align-items: center; gap: 6px; overflow: hidden;">
              <span class="stream-filename" id="stream-filename">index.m3u8</span>
              <span class="badge badge-provider" id="stream-provider-badge" style="display: none;">Provider</span>
            </div>
            <button class="btn-icon-ghost" id="btn-copy-url" title="Copy stream URL">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
          <div class="stream-url-text" id="stream-url-text">Searching for video streams...</div>
        </div>

        <!-- If multiple streams found, allow selecting -->
        <div class="select-group" id="group-other-streams" style="display: none;">
          <label for="select-stream-choice">Available Streams:</label>
          <select id="select-stream-choice"></select>
        </div>

        <!-- Editable Video Title / File Name -->
        <div class="select-group">
          <label for="input-video-title">File Name / Title</label>
          <input type="text" id="input-video-title" placeholder="Video file name..." autocomplete="off">
        </div>

        <!-- Quality & Format Selector -->
        <div class="config-row">
          <div class="select-group flex-1">
            <label for="select-quality">Quality</label>
            <select id="select-quality">
              <option value="best" selected>Best Quality</option>
              <option value="1080p">1080p FHD</option>
              <option value="720p">720p HD</option>
              <option value="480p">480p SD</option>
              <option value="audio">Audio (MP3)</option>
            </select>
          </div>
          <div class="select-group flex-1">
            <label for="select-format">Format</label>
            <select id="select-format">
              <option value="mp4" selected>MP4</option>
              <option value="mkv">MKV</option>
              <option value="mp3">MP3</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary btn-full" id="btn-download-stream" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span id="btn-download-stream-label">Download Stream</span>
        </button>
      </div>

      <!-- Fallback: Download Page URL -->
      <div class="fallback-card">
        <button class="btn btn-secondary btn-full" id="btn-download-page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
          <span>Download Page URL (yt-dlp)</span>
        </button>
      </div>
    </main>

    <!-- Feedback Message Banner -->
    <div class="message-banner" id="message-banner"></div>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="link-dashboard" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        <span>Open Local Web Dashboard</span>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
